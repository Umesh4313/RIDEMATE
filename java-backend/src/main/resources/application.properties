# ===== RIDEMATE Car Rental - Spring Boot Application Config =====
spring.application.name=ridemate-backend

# Server
server.port=8085
server.servlet.context-path=/

# Database Configuration (H2 persistent file database with PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:file:./data/ridematedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MongoDB Configuration (Industrial-Ready Document Store)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridemate}
spring.data.mongodb.auto-index-creation=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=RideMate-Super-Secret-JWT-Key-2026-Production-256Bits-Secure
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174

# Voucher PDF directory (temporary storage)
app.voucher.output-dir=./vouchers

# SpringDoc OpenAPI 3.0 / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Actuator Endpoints (Production Health & Monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.io.ridemate=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=INFO
